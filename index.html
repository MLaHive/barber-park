<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Parks Ops Adventures — Barber Park</title>
<style>
  :root{
    --night:#0d1b3d; --panel:#122a52; --gold:#f5c518; --sky:#3f7fd6;
    --grass:#3f8f3a; --white:#f2f2ec; --red:#d64541; --green:#7ed957;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;background:var(--night);overflow:hidden;
    font-family:'Courier New',monospace;color:var(--white)}
  #wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
  #stage{position:relative;
    width:min(100vw, calc(100vh * 1.7778));
    height:min(100vh, calc(100vw * 0.5625))}
  @supports (height:100dvh){
    #stage{width:min(100dvw, calc(100dvh * 1.7778));
           height:min(100dvh, calc(100dvw * 0.5625))}
  }
  canvas{position:absolute;inset:0;width:100%;height:100%;
    image-rendering:pixelated;image-rendering:crisp-edges;background:var(--sky);
    border:4px solid #000;box-shadow:0 0 0 3px var(--panel), 0 0 40px rgba(0,0,0,.6)}
  /* pixel-style text everywhere */
  .px{font-weight:700;letter-spacing:1px;text-transform:uppercase;
    text-shadow:2px 2px 0 #000}
  /* touch controls */
  #pads{position:absolute;inset:0;pointer-events:none;display:none}
  @media (pointer:coarse){ #pads{display:block} }
  .pad{position:absolute;bottom:3%;width:11%;max-width:90px;aspect-ratio:1;pointer-events:auto;
    background:rgba(13,27,61,.45);border:3px solid rgba(245,197,24,.65);border-radius:14px;
    display:flex;align-items:center;justify-content:center;font-size:clamp(16px,3vw,28px);
    color:var(--gold);user-select:none;-webkit-user-select:none;touch-action:none}
  .pad:active{background:rgba(245,197,24,.35)}
  #padL{left:3%} #padR{left:16%} #padA{right:3%;border-radius:50%;background:rgba(214,69,65,.45);border-color:#fff}
  #padB{right:16%;border-radius:50%;background:rgba(63,143,58,.45);border-color:#7ed957}
  /* during dialogue: hide movement, slim down A */
  body.dlg #padL, body.dlg #padR, body.dlg #padB{display:none}
  body.dlg #padA{width:9%;opacity:.75;bottom:2%}
</style>
</head>
<body>
<div id="wrap"><div id="stage">
  <canvas id="cv" width="960" height="540"></canvas>
  <div id="pads">
    <div class="pad px" id="padL">◀</div>
    <div class="pad px" id="padR">▶</div>
    <div class="pad px" id="padB">▲</div>
    <div class="pad px" id="padA">A</div>
  </div>
</div></div>

let AC = null;
function beep(freq, dur=0.09, type='square', vol=0.15){
  try{
    AC = AC || new (window.AudioContext||window.webkitAudioContext)();
    const o = AC.createOscillator(), g = AC.createGain();
    o.type = type; o.frequency.value = freq;
    g.gain.setValueAtTime(vol, AC.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, AC.currentTime+dur);
    o.connect(g); g.connect(AC.destination);
    o.start(); o.stop(AC.currentTime+dur);
  }catch(e){}
}

function bindPad(id, key){
  const el = document.getElementById(id);
  const on = e=>{ e.preventDefault(); G.keys[key]=true; if(key==='a!') action(); };
  const off= e=>{ e.preventDefault(); G.keys[key]=false; };

  el.addEventListener('pointercancel', off);
}

/* ================= ACTION BUTTON ================= */
function action(){
  beepUnlock();
  if (G.mode==='title'){
    G.mode='play'; beep(880);
    tryFullscreen();
    return;
  }
  if (G.mode==='win'||G.mode==='lose'){ reset(); return; }
  if (G.mode==='dialog'||G.mode==='solve'){
    if (!G.dlgDone){ G.dlgChar = 9999; G.dlgDone = true; return; } // fast-forward typing
    G.dlgPage++; G.dlgChar = 0; G.dlgDone = false;
    const src = (G.mode==='solve') ? FINALE : G.dlg.lines;
    if (G.dlgPage >= src.length){
      if (G.mode==='solve'){ G.mode='win'; jingle(); }
      else {
        if (!G.clues[G.dlg.id]){ G.clues[G.dlg.id]=true; jingle(); }
        G.mode='play'; G.dlg=null;
      }
    } else beep(660,0.05);
    return;
  }
  // in play: near an NPC?
  const n = npcs.find(n=>Math.abs(n.x - G.px) < 70);
  if (n){ G.mode='dialog'; G.dlg=n; G.dlgPage=0; G.dlgChar=0; G.dlgDone=false; beep(660,0.05); return; }
  // near the sign with all clues?
  if (G.clues.every(c=>c) && Math.abs(SIGN_X - G.px) < 90){
    G.mode='solve'; G.dlgPage=0; G.dlgChar=0; G.dlgDone=false; beep(660,0.05);
  }
}
function tryFullscreen(){
  if (!matchMedia('(pointer:coarse)').matches) return;
  if (document.fullscreenElement || document.webkitFullscreenElement) return;
  const el = document.documentElement;
  const fs = el.requestFullscreen || el.webkitRequestFullscreen;
  if (fs) try{ const r = fs.call(el); if (r && r.catch) r.catch(()=>{}); }catch(e){}
}

/* ================= DUST ================= */
const parts=[];
function spawnDust(x,n){
  for(let i=0;i<n;i++) parts.push({x:x+(Math.random()*16-8), y:GROUND+2-Math.random()*4,
    vx:(Math.random()*60-30), vy:-(20+Math.random()*40), life:0.4});
}

/* ================= UPDATE ================= */
let last = performance.now();
function update(dt){
  if (G.mode!=='play') return;
  const L = G.keys['arrowleft']||G.keys['a'], R = G.keys['arrowright']||G.keys['d'];
  const SPEED = 200;
  G.vx = (R?SPEED:0) - (L?SPEED:0);
  if (G.vx!==0) G.facing = Math.sign(G.vx);
  G.px = Math.max(60, Math.min(WORLD-60, G.px + G.vx*dt));

  // jump (edge-triggered)
  const J = G.keys['arrowup']||G.keys['w'];
  if (J && !G.jumpHeld && G.grounded){
    G.vy = 800; G.grounded = false; beep(440,0.07,'square',0.08);
  }
  G.jumpHeld = !!J;

  // vertical physics: heavier gravity falling than rising
  if (!G.grounded){
    G.py += G.vy*dt;
    G.vy -= (G.vy>0 ? 2400 : 3300)*dt;
    if (G.py<=0){ G.py=0; G.vy=0; G.grounded=true; spawnDust(G.px,5); }
  }

  // walk animation synced to stride, with footstep dust
  if (G.grounded && G.vx!==0){
    G.animT += dt;
    if (G.animT>0.085){
      G.animT=0; G.frame=(G.frame+1)%WALK.length;
      if (G.frame===0||G.frame===2) spawnDust(G.px - G.facing*6, 2);
    }
  } else if (G.grounded){ G.frame=0; G.animT=0; }

  // dust particles
  for(let i=parts.length-1;i>=0;i--){
    const p=parts[i];
    p.x+=p.vx*dt; p.y+=p.vy*dt; p.vy+=160*dt; p.life-=dt;
    if (p.life<=0) parts.splice(i,1);
  }

  // coins: you have to actually reach them now
  const feet = GROUND - G.py;
  coins.forEach(c=>{
    if (!c.got && Math.abs(c.x-G.px)<30 && c.y > feet-104 && c.y < feet+6){
      c.got=true; G.coins++; beep(1200,0.07,'square',0.12);
    }
  });

  // timer
  G.timeAcc += dt;
  if (G.timeAcc>=1){ G.timeAcc-=1; G.time--; if (G.time<=0){ G.time=0; G.mode='lose'; beep(180,0.5,'sawtooth',0.2);} }

  // camera
  camX = Math.max(0, Math.min(WORLD-W, G.px - W/2));
}

/* ================= DRAW HELPERS ================= */
function px(x,y,w,h,c){ ctx.fillStyle=c; ctx.fillRect(Math.round(x),Math.round(y),w,h); }

function dk(hex,f=0.72){
  const n=parseInt(hex.slice(1),16);
  return 'rgb('+(((n>>16)&255)*f|0)+','+(((n>>8)&255)*f|0)+','+((n&255)*f|0)+')';
}
function shadowW(x,w){ ctx.fillStyle='rgba(0,0,0,.22)'; ctx.beginPath(); ctx.ellipse(x,GROUND+4,w,5,0,0,6.3); ctx.fill(); }
function drawPalm(x,y){
  for(let i=0;i<6;i++) px(x+i*2, y-(i+1)*10, 7,11,'#8a6a3d');
  const tx=x+12, ty=y-64;
  px(tx-26,ty-2,24,6,'#2f8f3a'); px(tx+4,ty-2,24,6,'#2f8f3a');
  px(tx-20,ty-10,18,6,'#3fa04a'); px(tx+4,ty-10,18,6,'#3fa04a');
  px(tx-4,ty-14,10,8,'#27804a');
  px(tx-22,ty+4,16,5,'#27804a'); px(tx+8,ty+4,16,5,'#27804a');
}
function drawBirds(){
  const t=performance.now()/1000;
  for(let i=0;i<3;i++){
    const bx=((t*22+i*420)%(W+240))-120;
    const by=70+i*38+Math.sin(t*2+i)*8;
    ctx.strokeStyle='rgba(25,35,60,.65)'; ctx.lineWidth=2; ctx.beginPath();
    ctx.moveTo(bx-7,by); ctx.lineTo(bx-2,by-4); ctx.lineTo(bx+3,by); ctx.stroke();
  }
}
function drawTank(x){
  const y=GROUND;
  shadowW(x,46);
  px(x+34,y-3,70,5,'#f2f2ec');  // fresh line trailing behind
  if (tank.complete && tank.naturalWidth) ctx.drawImage(tank, x-62, y-70);
  else px(x-26,y-32,52,24,'#8bc34a');
}
function drawCloud(x,y,s){
  px(x-8*s,y+4*s,76*s,12*s,'#eef4fb');
  px(x,y-4*s,60*s,14*s,'#ffffff');
  px(x+12*s,y-12*s,34*s,12*s,'#ffffff');
  px(x+6*s,y+10*s,50*s,6*s,'#dce8f4');
}
function drawTree(x,y,v){
  if (v===2){ // bush
    px(x+2,y-24,40,20,'#2f7a2c'); px(x+8,y-32,28,12,'#3f8f3a'); px(x+12,y-30,12,6,'#57a850');
    return;
  }
  if (v===1){ // pine
    px(x+16,y-18,8,18,'#5c3d22');
    px(x-2,y-40,44,16,'#1e6b34');
    px(x+4,y-54,32,16,'#27804a');
    px(x+10,y-66,20,14,'#2f8f3a');
    px(x+15,y-74,10,10,'#3fa04a');
    return;
  }
  // oak
  px(x+12,y-26,10,26,'#6b4a2a'); px(x+12,y-26,3,26,'#57391f');
  px(x-14,y-52,60,22,'#2a6d27');
  px(x-6,y-74,46,30,'#2f7a2c');
  px(x+2,y-90,30,24,'#3f8f3a');
  px(x+8,y-86,14,8,'#57a850');
}
function drawCone(x){
  const y = GROUND;
  shadowW(x,16);
  px(x-14,y-6,28,6,'#b8430f'); px(x-14,y-6,28,2,'#d95418');
  px(x-9,y-26,18,20,'#e35d1b'); px(x-9,y-26,4,20,'#c34b12');
  px(x-7,y-20,14,5,'#f6f6f2'); px(x-7,y-20,14,2,'#ffffff');
  px(x-5,y-38,10,12,'#e35d1b'); px(x-5,y-38,3,12,'#c34b12');
}
function drawGoal(x){
  const y = GROUND; ctx.fillStyle='#e8e8e8';
  px(x,y-110,6,110,'#e8e8e8'); px(x+150,y-110,6,110,'#e8e8e8'); px(x,y-110,156,6,'#e8e8e8');
  ctx.strokeStyle='rgba(255,255,255,.5)'; ctx.lineWidth=1;
  for(let i=1;i<6;i++){ ctx.beginPath(); ctx.moveTo(x+i*26,y-104); ctx.lineTo(x+i*26,y); ctx.stroke(); }
}
function drawPipe(x){
  const y=GROUND; px(x-24,y-56,48,56,'#1a6fd4'); px(x-30,y-70,60,18,'#1a6fd4');
  px(x-30,y-70,60,4,'#5ea8f0'); px(x-24,y-56,6,56,'#5ea8f0');
}
function drawSign(x){
  const y=GROUND; px(x-4,y-70,8,70,'#6b4a2a');
  px(x-72,y-128,144,62,'#7a5230'); px(x-66,y-122,132,50,'#8f6238');
  ctx.fillStyle='#2c1c0e'; ctx.font='700 13px "Courier New"'; ctx.textAlign='center';
  ctx.fillText('SOLVE THE', x, y-102); ctx.fillText('MYSTERY HERE', x, y-86);
}
function drawNPC(n){
  const y = GROUND, sx = n.x;
  const b = Math.round(Math.sin(performance.now()/420 + n.id*2)*1.2);
  shadowW(sx, 20);
  const img = npcImgs[n.id];
  if (img && img.complete && img.naturalWidth){
    ctx.drawImage(img, sx - img.naturalWidth/2, y - 96 + b);
  } else {
    px(sx-14,y-90,28,90,'#666');
  }
  // talk prompt
  if (G.mode==='play' && Math.abs(n.x-G.px)<70){
    const bob = Math.sin(performance.now()/180)*3;
    ctx.fillStyle='#f5c518'; ctx.font='700 22px "Courier New"'; ctx.textAlign='center';
    ctx.fillText('!', sx, y-116+bob);
    ctx.font='700 11px "Courier New"'; ctx.fillStyle='#fff';
    ctx.fillText('PRESS A', sx, y-104+bob);
  }
}
function drawKevin(){
  const sx = G.px - camX, y = GROUND - G.py;
  const f = !G.grounded ? 2 : (G.vx!==0 ? WALK[G.frame] : 0);
  const bob = (G.grounded && G.vx!==0 && (G.frame%2===1)) ? 2 : 0;
  // shadow stays on the ground, shrinking with height
  const sc = Math.max(0.35, 1 - G.py/260);
  ctx.fillStyle='rgba(0,0,0,'+(0.22*sc).toFixed(3)+')';
  ctx.beginPath(); ctx.ellipse(sx,GROUND+4,19*sc,5*sc,0,0,6.3); ctx.fill();
  ctx.save();
  ctx.translate(sx, y + bob);
  if (G.facing<0) ctx.scale(-1,1);
  if (kevin.complete && kevin.naturalWidth) ctx.drawImage(kevin, f*FW,0,FW,FH, -FW/2,-FH, FW,FH);
  else { px(-12,-90,24,90,'#2255aa'); }
  ctx.restore();
  // footstep / landing dust
  ctx.fillStyle='#c9b08a';
  parts.forEach(p=>{ ctx.globalAlpha=Math.max(p.life,0)/0.4; ctx.fillRect(p.x-camX-2,p.y-2,4,4); });
  ctx.globalAlpha=1;
}

/* ================= DRAW SCENE ================= */
function drawWorld(){
  // sky
  const g = ctx.createLinearGradient(0,0,0,H);
  g.addColorStop(0,'#1e5bb8'); g.addColorStop(.55,'#5b9be0'); g.addColorStop(1,'#a8d4f0');
  ctx.fillStyle=g; ctx.fillRect(0,0,W,H);
  // sun
  ctx.fillStyle='rgba(255,236,150,.25)'; ctx.beginPath(); ctx.arc(836,84,48,0,6.3); ctx.fill();
  ctx.fillStyle='#ffd94d'; ctx.beginPath(); ctx.arc(836,84,26,0,6.3); ctx.fill();
  ctx.fillStyle='#fff3b0'; ctx.beginPath(); ctx.arc(830,78,10,0,6.3); ctx.fill();
  // flat Florida horizon: continuous grass field behind the fence
  px(0,GROUND-142,W,10,'#a9d8a0');
  px(0,GROUND-134,W,54,'#8ecb7c');
  px(0,GROUND-82,W,76,'#5fae54');
  // distant palms
  const p0=-(camX*0.3);
  for(let x=(p0%460)-460; x<W+460; x+=460){
    drawPalm(x+90, GROUND-72);
    drawPalm(x+300, GROUND-60);
  }
  // clouds + birds
  const c1 = -(camX*0.35)%1200;
  drawCloud(c1+120,74,1.2); drawCloud(c1+520,128,0.9); drawCloud(c1+900,58,1.4);
  drawCloud(c1+1320,104,1.0);
  drawBirds();
  // far dark treeline
  const f0=-(camX*0.45);
  for(let x=(f0%96)-96; x<W+96; x+=96){ px(x,GROUND-100,74,30,'#1d5626'); px(x+12,GROUND-110,50,14,'#1d5626'); }
  // near treeline (oak / pine / bush variants)
  const t0 = -(camX*0.6);
  for(let x=t0%130-130; x<W+130; x+=130){
    const v=((Math.round((x-t0)/130))%3+3)%3;
    drawTree(x+40, GROUND-58, v);
  }
  // ==== world space ====
  ctx.save(); ctx.translate(-camX,0);
  // fence posts + rails + chain-link
  for(let x=0;x<WORLD;x+=90){ px(x,GROUND-100,5,100,'#8b959e'); px(x,GROUND-100,2,100,'#b7c0c8'); }
  px(0,GROUND-98,WORLD,3,'#9aa4ad'); px(0,GROUND-50,WORLD,3,'#9aa4ad');
  ctx.strokeStyle='rgba(200,210,220,.28)'; ctx.lineWidth=1;
  for(let x=0;x<WORLD;x+=24){
    ctx.beginPath(); ctx.moveTo(x,GROUND-95); ctx.lineTo(x+24,GROUND-53); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(x+24,GROUND-95); ctx.lineTo(x,GROUND-53); ctx.stroke();
  }
  // grass band: mow stripes, paint lines, tufts
  px(0,GROUND-6,WORLD,26,'#3f8f3a');
  px(0,GROUND-6,WORLD,4,'#57a850');
  for(let x=0;x<WORLD;x+=170) px(x,GROUND-6,85,26,'rgba(255,255,255,.06)');
  for(let x=240;x<WORLD;x+=170){ px(x,GROUND-4,6,22,'#f2f2ec'); }
  for(let x=30;x<WORLD;x+=57){ px(x,GROUND-9,3,4,'#57a850'); }
  // dirt
  px(0,GROUND+20,WORLD,H-GROUND-20,'#7a5230');
  px(0,GROUND+20,WORLD,4,'#8f6238');
  for(let x=0;x<WORLD;x+=48){ px(x+((x/48)%2)*17,GROUND+40+ (x%96)/3, 10,8,'#6b4526'); }
  for(let x=20;x<WORLD;x+=131){ px(x,GROUND+58,7,5,'#9a8a70'); }
  // props
  drawGoal(300); drawGoal(1520);
  drawTank(470);
  cones.forEach(drawCone);
  drawPipe(2280);
  drawSign(SIGN_X);
  // coins
  coins.forEach(c=>{
    if (c.got) return;
    const bob = Math.sin(performance.now()/220 + c.t)*5;
    px(c.x-8, c.y+bob, 16,16, '#f5c518'); px(c.x-4, c.y+4+bob, 8,8, '#c99a10');
    px(c.x-6, c.y+2+bob, 4,4, '#fff8d0');
  });
  // npcs
  npcs.forEach(n=>drawNPC(n));
  ctx.restore();
}

function hud(){
  ctx.textAlign='left';
  // top-left: coins & stars
  panel(12,12,180,64);
  ctx.fillStyle='#f5c518'; ctx.font='700 18px "Courier New"';
  ctx.fillText('◉ x '+String(G.coins).padStart(2,'0'), 28, 38);
  ctx.fillText('★ x '+G.stars, 28, 62);
  // top-right: timer
  panel(W-152,12,140,44);
  ctx.fillStyle = G.time<60 ? '#ff5d5d' : '#fff';
  ctx.fillText('TIME '+G.time, W-136, 41);
  // clues
  panel(12,H-58,236,46);
  ctx.fillStyle='#7ed957'; ctx.font='700 15px "Courier New"';
  ctx.fillText('CLUES', 26, H-38);
  for(let i=0;i<3;i++){
    const x = 96+i*44;
    ctx.strokeStyle='#f5c518'; ctx.lineWidth=2; ctx.strokeRect(x,H-48,30,28);
    ctx.fillStyle = G.clues[i] ? '#7ed957' : 'rgba(255,255,255,.35)';
    ctx.font='700 18px "Courier New"'; ctx.textAlign='center';
    ctx.fillText(G.clues[i]?'✓':'?', x+15, H-27);
    ctx.textAlign='left'; ctx.font='700 15px "Courier New"';
  }
  // objective hint
  if (G.mode==='play'){
    ctx.textAlign='center'; ctx.font='700 13px "Courier New"';
    ctx.fillStyle='rgba(255,255,255,.9)';
    const msg = G.clues.every(c=>c)
      ? '➜ HEAD TO THE SIGN AND SOLVE IT'
      : 'FIND OUT WHY THE FIELDS ARE BEING LAID OUT EARLY';
    ctx.fillText(msg, W/2, 34);
  }
}
function panel(x,y,w,h){
  ctx.fillStyle='rgba(13,27,61,.82)'; ctx.fillRect(x,y,w,h);
  ctx.strokeStyle='#f5c518'; ctx.lineWidth=3; ctx.strokeRect(x,y,w,h);
}

/* ================= DIALOG (speech bubbles) ================= */
function roundRect(x,y,w,h,r){
  ctx.beginPath();
  ctx.moveTo(x+r,y);
  ctx.arcTo(x+w,y,x+w,y+h,r);
  ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r);
  ctx.arcTo(x,y,x+w,y,r);
  ctx.closePath();
}
function wrapText(t,maxW){
  const words=t.split(' '), out=[]; let cur='';
  for(const w of words){
    const test=cur?cur+' '+w:w;
    if (ctx.measureText(test).width>maxW && cur){ out.push(cur); cur=w; }
    else cur=test;
  }
  if(cur) out.push(cur);
  return out;
}
function drawDialog(){
  const src  = (G.mode==='solve') ? FINALE : G.dlg.lines;
  const name = (G.mode==='solve') ? 'KEVIN' : G.dlg.name;
  const line = src[Math.min(G.dlgPage, src.length-1)];
  G.dlgChar = Math.min(G.dlgChar + 1.6, line.length);
  if (G.dlgChar >= line.length) G.dlgDone = true;

  // who's talking, in screen coords
  const spkWorld = (G.mode==='solve') ? G.px : G.dlg.x;
  const spkX = spkWorld - camX;

  // layout from the FULL line so the bubble doesn't resize while typing
  ctx.font='700 21px "Courier New"'; ctx.textAlign='left';
  const bw = 500, pad = 18, lh = 28;
  const wrapped = wrapText(line, bw - pad*2);
  const bh = 48 + wrapped.length*lh + 20;
  const bx = Math.max(10, Math.min(W-bw-10, spkX - bw/2));
  const by = Math.max(10, GROUND - 96 - 34 - bh);

  // bubble + tail
  const tailX = Math.max(bx+26, Math.min(bx+bw-26, spkX));
  ctx.fillStyle='#fdfdf8'; ctx.strokeStyle='#0d1b3d'; ctx.lineWidth=3;
  ctx.beginPath();
  ctx.moveTo(tailX-11, by+bh); ctx.lineTo(spkX, GROUND-100); ctx.lineTo(tailX+11, by+bh);
  ctx.closePath(); ctx.fill(); ctx.stroke();
  roundRect(bx,by,bw,bh,10); ctx.fill(); ctx.stroke();
  ctx.fillStyle='#fdfdf8'; ctx.fillRect(tailX-10, by+bh-3, 20, 5);

  // name
  ctx.fillStyle='#b3400f'; ctx.font='700 16px "Courier New"';
  ctx.fillText(name, bx+pad, by+27);
  // text (typewriter across wrapped lines)
  ctx.fillStyle='#0c121c'; ctx.font='700 21px "Courier New"';
  let remaining = Math.floor(G.dlgChar);
  wrapped.forEach((wl,i)=>{
    if (remaining<=0) return;
    ctx.fillText(wl.slice(0,remaining), bx+pad, by+52+i*lh);
    remaining -= wl.length+1;
  });
  // advance prompt
  ctx.fillStyle='rgba(28,36,48,.6)'; ctx.font='700 14px "Courier New"';
  ctx.fillText(G.dlgDone ? '[A] NEXT' : '[A] SKIP', bx+bw-100, by+bh-11);

  // clue banner on last page
  if (G.mode==='dialog' && G.dlgPage===src.length-1 && G.dlgDone && !G.clues[G.dlg.id]){
    ctx.font='700 17px "Courier New"'; ctx.textAlign='center';
    const msg = 'NEW \u279c ' + G.dlg.clue;
    const mw = ctx.measureText(msg).width;
    ctx.fillStyle='rgba(13,27,61,.88)'; ctx.fillRect(W/2-mw/2-14, 36, mw+28, 32);
    ctx.strokeStyle='#7ed957'; ctx.lineWidth=2; ctx.strokeRect(W/2-mw/2-14, 36, mw+28, 32);
    ctx.fillStyle='#7ed957';
    ctx.fillText(msg, W/2, 58);
    ctx.textAlign='left';
  }
}

/* ================= SCREENS ================= */
function drawTitle(){
  ctx.fillStyle='rgba(6,12,30,.78)'; ctx.fillRect(0,0,W,H);
  ctx.textAlign='center';
  ctx.fillStyle='#f5c518'; ctx.font='700 34px "Courier New"';
  ctx.fillText('PARKS OPS ADVENTURES', W/2, 170);
  ctx.fillStyle='#fff'; ctx.font='700 20px "Courier New"';
  ctx.fillText('MISSION 1 — BARBER PARK', W/2, 220);
  ctx.fillText('THE BIG MYSTERY', W/2, 250);
  ctx.fillStyle='#8fc1ec'; ctx.font='700 14px "Courier New"';
  ctx.fillText('WHY IS THE PAINT CREW LAYING OUT FIELDS', W/2, 310);
  ctx.fillText('BEFORE THE SEASON STARTS?', W/2, 332);
  ctx.fillStyle='#7ed957'; ctx.font='700 15px "Courier New"';
  ctx.fillText('← → MOVE    ▲ JUMP    A = TALK', W/2, 396);
  const blink = Math.floor(performance.now()/500)%2===0;
  if (blink){ ctx.fillStyle='#f5c518'; ctx.fillText('PRESS A TO START', W/2, 450); }
}
function drawWin(){
  ctx.fillStyle='rgba(6,12,30,.85)'; ctx.fillRect(0,0,W,H);
  ctx.textAlign='center';
  ctx.fillStyle='#f5c518'; ctx.font='700 40px "Courier New"';
  ctx.fillText('★ MYSTERY SOLVED ★', W/2, 180);
  ctx.fillStyle='#fff'; ctx.font='700 18px "Courier New"';
  ctx.fillText('MEASURE EARLY. USE THE QUIET WEEK.', W/2, 240);
  ctx.fillText('AND PAINTING FIELDS IS, IN FACT,', W/2, 270);
  ctx.fillText('THE JOB. CASE CLOSED, KEVIN.', W/2, 300);
  ctx.fillStyle='#7ed957'; ctx.font='700 17px "Courier New"';
  ctx.fillText('WOW POINTS +500      COINS x '+G.coins+'      TIME LEFT '+G.time, W/2, 360);
  ctx.fillStyle='#f5c518';
  if (Math.floor(performance.now()/500)%2===0) ctx.fillText('PRESS A TO PLAY AGAIN', W/2, 430);
}
function drawLose(){
  ctx.fillStyle='rgba(30,6,6,.85)'; ctx.fillRect(0,0,W,H);
  ctx.textAlign='center';
  ctx.fillStyle='#ff5d5d'; ctx.font='700 36px "Courier New"';
  ctx.fillText('OUT OF TIME', W/2, 220);
  ctx.fillStyle='#fff'; ctx.font='700 16px "Courier New"';
  ctx.fillText('THE MYSTERY REMAINS. KEVIN CLOCKS OUT.', W/2, 270);
  ctx.fillStyle='#f5c518';
  if (Math.floor(performance.now()/500)%2===0) ctx.fillText('PRESS A TO RETRY', W/2, 340);
}

/* ================= LOOP ================= */
function loop(now){
  const dt = Math.min((now-last)/1000, 0.05); last = now;
  document.body.classList.toggle('dlg', G.mode==='dialog'||G.mode==='solve');
  update(dt);
  drawWorld();
  drawKevin();
  hud();
  if (G.mode==='dialog'||G.mode==='solve') drawDialog();
  if (G.mode==='title') drawTitle();
  if (G.mode==='win')   drawWin();
  if (G.mode==='lose')  drawLose();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
