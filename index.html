<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Parks Ops Adventures — Barber Park</title>
<style>
  :root{
    --night:#0d1b3d; --panel:#122a52; --gold:#f5c518; --sky:#3f7fd6;
    --grass:#3f8f3a; --white:#f2f2ec; --red:#d64541; --green:#7ed957;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;background:var(--night);overflow:hidden;
    font-family:'Courier New',monospace;color:var(--white)}
  #wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
  #stage{position:relative;width:min(100vw,178vh);aspect-ratio:16/9;max-height:100vh}
  canvas{position:absolute;inset:0;width:100%;height:100%;
    image-rendering:pixelated;image-rendering:crisp-edges;background:var(--sky);
    border:4px solid #000;box-shadow:0 0 0 3px var(--panel), 0 0 40px rgba(0,0,0,.6)}
  /* pixel-style text everywhere */
  .px{font-weight:700;letter-spacing:1px;text-transform:uppercase;
    text-shadow:2px 2px 0 #000}
  /* touch controls */
  #pads{position:absolute;inset:0;pointer-events:none;display:none}
  @media (pointer:coarse){ #pads{display:block} }
  .pad{position:absolute;bottom:3%;width:11%;max-width:90px;aspect-ratio:1;pointer-events:auto;
    background:rgba(13,27,61,.45);border:3px solid rgba(245,197,24,.65);border-radius:14px;
    display:flex;align-items:center;justify-content:center;font-size:clamp(16px,3vw,28px);
    color:var(--gold);user-select:none;-webkit-user-select:none;touch-action:none}
  .pad:active{background:rgba(245,197,24,.35)}
  #padL{left:3%} #padR{left:16%} #padA{right:3%;border-radius:50%;background:rgba(214,69,65,.45);border-color:#fff}
  /* during dialogue: hide movement, slim down A */
  body.dlg #padL, body.dlg #padR{display:none}
  body.dlg #padA{width:9%;opacity:.75;bottom:2%}
</style>
</head>
<body>
<div id="wrap"><div id="stage">
  <canvas id="cv" width="960" height="540"></canvas>
  <div id="pads">
    <div class="pad px" id="padL">◀</div>
    <div class="pad px" id="padR">▶</div>
    <div class="pad px" id="padA">A</div>
  </div>
</div></div>

let AC = null;
function beep(freq, dur=0.09, type='square', vol=0.15){
  try{
    AC = AC || new (window.AudioContext||window.webkitAudioContext)();
    const o = AC.createOscillator(), g = AC.createGain();
    o.type = type; o.frequency.value = freq;
    g.gain.setValueAtTime(vol, AC.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, AC.currentTime+dur);
    o.connect(g); g.connect(AC.destination);
    o.start(); o.stop(AC.currentTime+dur);
  }catch(e){}
}

function bindPad(id, key){

    const src = (G.mode==='solve') ? FINALE : G.dlg.lines;
    if (G.dlgPage >= src.length){
      if (G.mode==='solve'){ G.mode='win'; jingle(); }
      else {
        if (!G.clues[G.dlg.id]){ G.clues[G.dlg.id]=true; jingle(); }
        G.mode='play'; G.dlg=null;
      }
    } else beep(660,0.05);
    return;
  }
  // in play: near an NPC?
  const n = npcs.find(n=>Math.abs(n.x - G.px) < 70);
  if (n){ G.mode='dialog'; G.dlg=n; G.dlgPage=0; G.dlgChar=0; G.dlgDone=false; beep(660,0.05); return; }
  // near the sign with all clues?
  if (G.clues.every(c=>c) && Math.abs(SIGN_X - G.px) < 90){
    G.mode='solve'; G.dlgPage=0; G.dlgChar=0; G.dlgDone=false; beep(660,0.05);
  }
}
function beepUnlock(){ try{ AC = AC || new (window.AudioContext||window.webkitAudioContext)(); if(AC.state==='suspended') AC.resume(); }catch(e){} }

function reset(){
  G.mode='title'; G.px=140; G.vx=0; G.facing=1; G.frame=0;
  G.coins=0; G.time=298; G.timeAcc=0; G.clues=[false,false,false];
  G.dlg=null; coins.forEach(c=>c.got=false);
}

/* ================= UPDATE ================= */
let last = performance.now();
function update(dt){
  if (G.mode!=='play') return;
  const L = G.keys['arrowleft']||G.keys['a'], R = G.keys['arrowright']||G.keys['d'];
  const SPEED = 240;
  G.vx = (R?SPEED:0) - (L?SPEED:0);
  if (G.vx!==0) G.facing = Math.sign(G.vx);
  G.px = Math.max(60, Math.min(WORLD-60, G.px + G.vx*dt));

  // walk animation
  if (G.vx!==0){ G.animT += dt; if (G.animT>0.12){ G.animT=0; G.frame=(G.frame+1)%WALK.length; } }
  else { G.frame=0; G.animT=0; }

  // coins
  coins.forEach(c=>{
    if (!c.got && Math.abs(c.x-G.px)<34 ){ c.got=true; G.coins++; beep(1200,0.07,'square',0.12); }
  });

  // timer
  G.timeAcc += dt;
  if (G.timeAcc>=1){ G.timeAcc-=1; G.time--; if (G.time<=0){ G.time=0; G.mode='lose'; beep(180,0.5,'sawtooth',0.2);} }

  // camera
  camX = Math.max(0, Math.min(WORLD-W, G.px - W/2));
}

/* ================= DRAW HELPERS ================= */
function px(x,y,w,h,c){ ctx.fillStyle=c; ctx.fillRect(Math.round(x),Math.round(y),w,h); }

function drawCloud(x,y,s){
  px(x,y,60*s,18*s,'#fff'); px(x+14*s,y-10*s,34*s,14*s,'#fff'); px(x-8*s,y+4*s,20*s,10*s,'#e9f2ff');
}
function drawTree(x,y){
  px(x+12,y-26,10,26,'#6b4a2a');
  px(x-6,y-70,46,34,'#2f7a2c'); px(x+2,y-88,30,26,'#3f8f3a'); px(x-14,y-52,60,22,'#2a6d27');
}
function drawCone(x){
  const y = GROUND;
  px(x-14,y-6,28,6,'#c34b12'); px(x-9,y-26,18,20,'#e35d1b'); px(x-7,y-19,14,5,'#fff');
  px(x-5,y-38,10,12,'#e35d1b');
}
function drawGoal(x){
  const y = GROUND; ctx.fillStyle='#e8e8e8';
  px(x,y-110,6,110,'#e8e8e8'); px(x+150,y-110,6,110,'#e8e8e8'); px(x,y-110,156,6,'#e8e8e8');
  ctx.strokeStyle='rgba(255,255,255,.5)'; ctx.lineWidth=1;
  for(let i=1;i<6;i++){ ctx.beginPath(); ctx.moveTo(x+i*26,y-104); ctx.lineTo(x+i*26,y); ctx.stroke(); }
}
function drawPipe(x){
  const y=GROUND; px(x-24,y-56,48,56,'#1a6fd4'); px(x-30,y-70,60,18,'#1a6fd4');
  px(x-30,y-70,60,4,'#5ea8f0'); px(x-24,y-56,6,56,'#5ea8f0');
}
function drawSign(x){
  const y=GROUND; px(x-4,y-70,8,70,'#6b4a2a');
  px(x-72,y-128,144,62,'#7a5230'); px(x-66,y-122,132,50,'#8f6238');
  ctx.fillStyle='#2c1c0e'; ctx.font='700 13px "Courier New"'; ctx.textAlign='center';
  ctx.fillText('SOLVE THE', x, y-102); ctx.fillText('MYSTERY HERE', x, y-86);
}
function drawNPC(n, sx){
  const y = GROUND, p = n.pal;
  // legs / shoes
  px(sx-14,y-8,10,8,'#2b2b2b'); px(sx+4,y-8,10,8,'#2b2b2b');
  px(sx-13,y-30,9,24,p.pants); px(sx+5,y-30,9,24,p.pants);
  // torso
  px(sx-17,y-66,34,38,p.shirt);
  // arms
  px(sx-24,y-62,8,26,p.shirt); px(sx+17,y-62,8,26,p.shirt);
  px(sx-24,y-38,8,8,p.skin); px(sx+17,y-38,8,8,p.skin);
  // head
  px(sx-12,y-90,24,24,p.skin);
  // hat
  px(sx-14,y-96,28,10,p.hat); px(sx-18,y-88,12,4,p.hat);
  // eyes
  px(sx-8,y-82,5,4,'#111'); px(sx+3,y-82,5,4,'#111');
  // talk prompt
  if (G.mode==='play' && Math.abs(n.x-G.px)<70){
    const bob = Math.sin(performance.now()/180)*3;
    ctx.fillStyle='#f5c518'; ctx.font='700 22px "Courier New"'; ctx.textAlign='center';
    ctx.fillText('!', sx, y-112+bob);
    ctx.font='700 11px "Courier New"'; ctx.fillStyle='#fff';
    ctx.fillText('PRESS A', sx, y-100+bob);
  }
}
function drawKevin(){
  const sx = G.px - camX, y = GROUND;
  const f = (G.vx!==0) ? WALK[G.frame] : 0;
  ctx.save();
  ctx.translate(sx, y);
  if (G.facing<0) ctx.scale(-1,1);
  if (kevin.complete && kevin.naturalWidth) ctx.drawImage(kevin, f*FW,0,FW,FH, -FW/2,-FH, FW,FH);
  else { px(-12,-90,24,90,'#2255aa'); } // fallback while loading
  ctx.restore();
}

/* ================= DRAW SCENE ================= */
function drawWorld(){
  // sky
  const g = ctx.createLinearGradient(0,0,0,H);
  g.addColorStop(0,'#2f6fd0'); g.addColorStop(.6,'#5b9be0'); g.addColorStop(1,'#8fc1ec');
  ctx.fillStyle=g; ctx.fillRect(0,0,W,H);
  // clouds (parallax)
  const c1 = -(camX*0.3)%1200;
  drawCloud(c1+120,70,1.2); drawCloud(c1+520,120,0.9); drawCloud(c1+900,60,1.4);
  drawCloud(c1+1320,100,1.0);
  // far treeline
  const t0 = -(camX*0.6);
  for(let x=t0%140-140; x<W+140; x+=140) drawTree(x+40, GROUND-60);
  // fence
  ctx.save(); ctx.translate(-camX,0);
  for(let x=0;x<WORLD;x+=90){ px(x,GROUND-100,5,100,'#9aa4ad'); }
  px(0,GROUND-98,WORLD,3,'#9aa4ad'); px(0,GROUND-50,WORLD,3,'#9aa4ad');
  // grass band + paint lines
  px(0,GROUND-6,WORLD,26,'#3f8f3a');
  px(0,GROUND-6,WORLD,4,'#57a850');
  for(let x=240;x<WORLD;x+=170){ px(x,GROUND-4,6,22,'#f2f2ec'); }
  // dirt
  px(0,GROUND+20,WORLD,H-GROUND-20,'#7a5230');
  for(let x=0;x<WORLD;x+=48){ px(x+((x/48)%2)*17,GROUND+40+ (x%96)/3, 10,8,'#6b4526'); }
  // props
  drawGoal(300); drawGoal(1520);
  cones.forEach(drawCone);
  drawPipe(2280);
  drawSign(SIGN_X);
  // coins
  coins.forEach(c=>{
    if (c.got) return;
    const bob = Math.sin(performance.now()/220 + c.t)*5;
    px(c.x-8, c.y+bob, 16,16, '#f5c518'); px(c.x-4, c.y+4+bob, 8,8, '#c99a10');
  });
  // npcs
  npcs.forEach(n=> drawNPC(n, n.x - camX + camX)); // draw in world space (translated)
  ctx.restore();
  // npc prompts & kevin are drawn in screen space:
}
/* NPCs drawn inside translate — but prompts used G.px vs n.x world coords, fine. */

function hud(){
  ctx.textAlign='left';
  // top-left: coins & stars
  panel(12,12,180,64);
  ctx.fillStyle='#f5c518'; ctx.font='700 18px "Courier New"';
  ctx.fillText('◉ x '+String(G.coins).padStart(2,'0'), 28, 38);
  ctx.fillText('★ x '+G.stars, 28, 62);
  // top-right: timer
  panel(W-152,12,140,44);
  ctx.fillStyle = G.time<60 ? '#ff5d5d' : '#fff';
  ctx.fillText('TIME '+G.time, W-136, 41);
  // clues
  panel(12,H-58,236,46);
  ctx.fillStyle='#7ed957'; ctx.font='700 15px "Courier New"';
  ctx.fillText('CLUES', 26, H-38);
  for(let i=0;i<3;i++){
    const x = 96+i*44;
    ctx.strokeStyle='#f5c518'; ctx.lineWidth=2; ctx.strokeRect(x,H-48,30,28);
    ctx.fillStyle = G.clues[i] ? '#7ed957' : 'rgba(255,255,255,.35)';
    ctx.font='700 18px "Courier New"'; ctx.textAlign='center';
    ctx.fillText(G.clues[i]?'✓':'?', x+15, H-27);
    ctx.textAlign='left'; ctx.font='700 15px "Courier New"';
  }
  // objective hint
  if (G.mode==='play'){
    ctx.textAlign='center'; ctx.font='700 13px "Courier New"';
    ctx.fillStyle='rgba(255,255,255,.9)';
    const msg = G.clues.every(c=>c)
      ? '➜ HEAD TO THE SIGN AND SOLVE IT'
      : 'FIND OUT WHY THE FIELDS ARE BEING LAID OUT EARLY';
    ctx.fillText(msg, W/2, 34);
  }
}
function panel(x,y,w,h){
  ctx.fillStyle='rgba(13,27,61,.82)'; ctx.fillRect(x,y,w,h);
  ctx.strokeStyle='#f5c518'; ctx.lineWidth=3; ctx.strokeRect(x,y,w,h);
}

/* ================= DIALOG ================= */
function drawDialog(){
  const src  = (G.mode==='solve') ? FINALE : G.dlg.lines;
  const name = (G.mode==='solve') ? 'KEVIN' : G.dlg.name;
  const line = src[Math.min(G.dlgPage, src.length-1)];
  G.dlgChar = Math.min(G.dlgChar + 1.6, line.length);
  if (G.dlgChar >= line.length) G.dlgDone = true;
  const shown = line.slice(0, Math.floor(G.dlgChar));

  const bx=60, by=H-170, bw=W-120, bh=120;
  panel(bx,by,bw,bh);
  ctx.fillStyle='#f5c518'; ctx.font='700 15px "Courier New"'; ctx.textAlign='left';
  ctx.fillText(name, bx+20, by+30);
  ctx.fillStyle='#fff'; ctx.font='700 17px "Courier New"';
  ctx.fillText(shown, bx+20, by+66);
  ctx.fillStyle='rgba(255,255,255,.6)'; ctx.font='700 12px "Courier New"';
  ctx.fillText(G.dlgDone ? '[A] NEXT' : '[A] SKIP', bx+bw-110, by+bh-16);

  // clue banner on last page
  if (G.mode==='dialog' && G.dlgPage===src.length-1 && G.dlgDone && !G.clues[G.dlg.id]){
    ctx.fillStyle='#7ed957'; ctx.font='700 13px "Courier New"'; ctx.textAlign='center';
    ctx.fillText('NEW ➜ '+G.dlg.clue, W/2, by-14);
  }
}

/* ================= SCREENS ================= */
function drawTitle(){
  ctx.fillStyle='rgba(6,12,30,.78)'; ctx.fillRect(0,0,W,H);
  ctx.textAlign='center';
  ctx.fillStyle='#f5c518'; ctx.font='700 34px "Courier New"';
  ctx.fillText('PARKS OPS ADVENTURES', W/2, 170);
  ctx.fillStyle='#fff'; ctx.font='700 20px "Courier New"';
  ctx.fillText('MISSION 1 — BARBER PARK', W/2, 220);
  ctx.fillText('THE BIG MYSTERY', W/2, 250);
  ctx.fillStyle='#8fc1ec'; ctx.font='700 14px "Courier New"';
  ctx.fillText('WHY IS THE PAINT CREW LAYING OUT FIELDS', W/2, 310);
  ctx.fillText('BEFORE THE SEASON STARTS?', W/2, 332);
  ctx.fillStyle='#7ed957'; ctx.font='700 15px "Courier New"';
  ctx.fillText('← → MOVE      A / SPACE = TALK', W/2, 396);
  const blink = Math.floor(performance.now()/500)%2===0;
  if (blink){ ctx.fillStyle='#f5c518'; ctx.fillText('PRESS A TO START', W/2, 450); }
}
function drawWin(){
  ctx.fillStyle='rgba(6,12,30,.85)'; ctx.fillRect(0,0,W,H);
  ctx.textAlign='center';
  ctx.fillStyle='#f5c518'; ctx.font='700 40px "Courier New"';
  ctx.fillText('★ MYSTERY SOLVED ★', W/2, 180);
  ctx.fillStyle='#fff'; ctx.font='700 18px "Courier New"';
  ctx.fillText('MEASURE EARLY. USE THE QUIET WEEK.', W/2, 240);
  ctx.fillText('AND PAINTING FIELDS IS, IN FACT,', W/2, 270);
  ctx.fillText('THE JOB. CASE CLOSED, KEVIN.', W/2, 300);
  ctx.fillStyle='#7ed957'; ctx.font='700 17px "Courier New"';
  ctx.fillText('WOW POINTS +500      COINS x '+G.coins+'      TIME LEFT '+G.time, W/2, 360);
  ctx.fillStyle='#f5c518';
  if (Math.floor(performance.now()/500)%2===0) ctx.fillText('PRESS A TO PLAY AGAIN', W/2, 430);
}
function drawLose(){
  ctx.fillStyle='rgba(30,6,6,.85)'; ctx.fillRect(0,0,W,H);
  ctx.textAlign='center';
  ctx.fillStyle='#ff5d5d'; ctx.font='700 36px "Courier New"';
  ctx.fillText('OUT OF TIME', W/2, 220);
  ctx.fillStyle='#fff'; ctx.font='700 16px "Courier New"';
  ctx.fillText('THE MYSTERY REMAINS. KEVIN CLOCKS OUT.', W/2, 270);
  ctx.fillStyle='#f5c518';
  if (Math.floor(performance.now()/500)%2===0) ctx.fillText('PRESS A TO RETRY', W/2, 340);
}

/* ================= LOOP ================= */
function loop(now){
  const dt = Math.min((now-last)/1000, 0.05); last = now;
  document.body.classList.toggle('dlg', G.mode==='dialog'||G.mode==='solve');
  update(dt);
  drawWorld();
  drawKevin();
  hud();
  if (G.mode==='dialog'||G.mode==='solve') drawDialog();
  if (G.mode==='title') drawTitle();
  if (G.mode==='win')   drawWin();
  if (G.mode==='lose')  drawLose();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
